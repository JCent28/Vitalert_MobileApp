<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Vitalert Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-colors">
    :root {
      --primary-teal: #007D79;
      --bg-gray: #F3F4F6;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-gray: #D1D5DB;
    }
  </style>
<style data-purpose="font-setup">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">
<!-- BEGIN: MainContent -->
<main class="w-full max-w-[400px]">
<!-- BEGIN: SignInCard -->
<div class="bg-white rounded-2xl shadow-sm p-6 sm:p-8 w-full" data-purpose="sign-in-card">
<!-- BEGIN: HeaderSection -->
<div class="text-center mb-8" data-purpose="header-section">
<!-- Logo -->
<div class="flex items-center justify-center gap-2 mb-2">
<svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12H18L15 21L9 3L6 12H2" stroke="#007D79" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<h1 class="text-[#002B49] text-xl font-bold tracking-wide">VITALERT</h1>
</div>
<p class="text-gray-500 text-sm">NephroAsia Dialysis Center</p>
</div>
<!-- END: HeaderSection -->
<!-- BEGIN: TitleSection -->
<div class="mb-6" data-purpose="title-section">
<h2 class="text-2xl font-bold text-gray-900 mb-1">Sign In</h2>
<p class="text-sm text-gray-500">Nurse station access · Authorized Personnel Only</p>
</div>
<!-- END: TitleSection -->
<!-- BEGIN: FormSection -->
<form data-purpose="sign-in-form">
<!-- Staff ID Input -->
<div class="mb-5">
<label class="block text-xs font-semibold text-[#4A5E6D] uppercase tracking-wider mb-2" for="staff-id">Staff ID</label>
<input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-1 focus:ring-teal-600 focus:border-teal-600 transition-colors text-gray-900 placeholder-gray-400" id="staff-id" placeholder="e.g. HN-00312" type="text">
</div>
<!-- Password Input -->
<div class="mb-5">
<label class="block text-xs font-semibold text-[#4A5E6D] uppercase tracking-wider mb-2" for="password">Password</label>
<input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-1 focus:ring-teal-600 focus:border-teal-600 transition-colors text-gray-900 placeholder-gray-400" id="password" placeholder="Enter password" type="password">
</div>
<!-- Role Dropdown -->
<div class="mb-8">
<label class="block text-xs font-semibold text-[#4A5E6D] uppercase tracking-wider mb-2" for="role">Role</label>
<div class="relative">
<select class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-1 focus:ring-teal-600 focus:border-teal-600 transition-colors text-gray-900 appearance-none bg-white pr-10" id="role">
<option>Head Nurse</option>
<option>Staff Nurse</option>
<option>Doctor</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#007D79] hover:bg-[#006663] text-white font-semibold px-4 rounded-lg transition-colors duration-200 shadow-sm py-2" type="submit">
          Sign In
        </button>
</form>
<!-- END: FormSection -->
</div>
<!-- END: SignInCard -->
<!-- BEGIN: FooterText -->
<div class="text-center mt-6" data-purpose="footer-text">
<p class="text-xs text-gray-400">VITALERT v1.0 · NephroAsia Dialysis Center</p>
</div>
<!-- END: FooterText -->
</main>
<!-- END: MainContent -->


</body></html>
