<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>VITALERT - Nurse Station Sign In | NephroAsia Dialysis Center</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased text-slate-800">
  <main class="w-full max-w-[400px]">
    <!-- Sign In Card -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-200/80 p-6 sm:p-8 w-full transition-all">
      <!-- Header Section -->
      <div class="text-center mb-8">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2.5 mb-2">
          <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center text-teal-700 border border-teal-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M22 12H18L15 21L9 3L6 12H2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <h1 class="text-slate-900 text-2xl font-black tracking-wider">VITALERT</h1>
        </div>
        <p class="text-slate-500 text-xs font-medium">NephroAsia Dialysis Center · Nurse Station</p>
      </div>

      <!-- Title Section -->
      <div class="mb-6 border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold text-slate-900">Sign In</h2>
        <p class="text-xs text-slate-500 mt-1">Authorized Clinical Personnel Only</p>
      </div>

      <!-- Form Section -->
      <form id="signInForm" action="dashboard.html" method="GET" class="space-y-4">
        <!-- Staff ID Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="staff-id">Staff ID</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-regular fa-id-badge text-sm"></i>
            </div>
            <input 
              class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition-colors text-slate-900 text-sm placeholder-slate-400" 
              id="staff-id" 
              placeholder="e.g. HN-00312" 
              value="HN-00312"
              required 
              type="text"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="password">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input 
              class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition-colors text-slate-900 text-sm placeholder-slate-400" 
              id="password" 
              placeholder="••••••••" 
              value="dialysis2026"
              required 
              type="password"
            >
          </div>
        </div>

        <!-- Role Dropdown -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="role">Clinical Role</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user-doctor text-sm"></i>
            </div>
            <select 
              class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition-colors text-slate-900 text-sm appearance-none bg-white" 
              id="role"
            >
              <option value="head-nurse">Head Nurse (Shift Lead)</option>
              <option value="staff-nurse">Staff Nurse</option>
              <option value="nephrologist">Nephrologist / Doctor</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-400">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          class="w-full mt-2 bg-[#007D79] hover:bg-[#006663] active:bg-[#004d40] text-white font-semibold py-2.5 px-4 rounded-lg transition-all duration-150 shadow-sm flex items-center justify-center gap-2 text-sm" 
          type="submit"
        >
          <span>Access Nurse Station</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Footer Text -->
    <div class="text-center mt-6">
      <p class="text-xs text-slate-400">VITALERT Clinical Suite v1.0 · NephroAsia Dialysis Center</p>
    </div>
  </main>

  <script>
    document.getElementById('signInForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
