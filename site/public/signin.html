<script>
        // Simple interaction for input focus styling if needed beyond CSS focus-within
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary-container');
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-outline');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary-container');
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-outline');
            });
        });
    </script>
